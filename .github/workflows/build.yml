
name: Build OrangeMod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OrangeMod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: v5.11.2

      - name: Upload OrangeMod
        uses: actions/upload-artifact@v4
        with:
          name: OrangeMod
          path: ${{ steps.build.outputs.build-output }}
